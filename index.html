<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#366887">
    <title>HELLO GUILD MASTER</title>
    <link rel="preload" href="/assets/sound/Bgm/Loby.mp3" as="audio" type="audio/mpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        #game.loading-screen { width: 100%; min-height: 100%; display: grid; place-items: center; margin: 0; padding: 24px; background: #366887; }
        #initial-loader { width: min(320px,80vw); color: #e2edf3; font: 500 13px/1.4 'Noto Sans KR',sans-serif; }
        #initial-loader-label { min-height: 20px; margin-bottom: 12px; text-align: center; }
        #loading-progress-track { height: 5px; overflow: hidden; border: 1px solid #a6d7e866; background: #24485e; }
        #loading-progress-fill { width: 4%; height: 100%; background: #a6d7e8; transition: width .24s ease; }
    </style>
</head>
<body>
    <div id="viewport-stage">
        <div id="stage-canvas">
            <main id="game" class="loading-screen" aria-live="polite">
                <div id="initial-loader" role="status">
                    <div id="initial-loader-label">Loading<span id="loading-dots">.</span></div>
                    <div id="loading-progress-track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><div id="loading-progress-fill"></div></div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">20 강화 불가</title>
<desc id="desc">빨간 정사각형 바탕에 대각선으로 맞물린 흰색 사슬 고리 두 개. 교차부에 간격을 두어 연결 구조를 표현.</desc>
<rect id="background" width="64" height="64" rx="9" fill="#E83D36"/>
<g id="chain" transform="rotate(45 32 32)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect id="upper_link" x="23" y="6" width="18" height="32" rx="9" stroke="#FFFFFF" stroke-width="5"/>
<rect id="lower_link_separation" x="23" y="26" width="18" height="32" rx="9" stroke="#E83D36" stroke-width="9"/>
<rect id="lower_link" x="23" y="26" width="18" height="32" rx="9" stroke="#FFFFFF" stroke-width="5"/>
<defs><clipPath id="front_crossing"><rect x="15" y="23" width="17" height="19"/></clipPath></defs>
<g clip-path="url(#front_crossing)">
<rect x="23" y="6" width="18" height="32" rx="9" stroke="#E83D36" stroke-width="9"/>
<rect x="23" y="6" width="18" height="32" rx="9" stroke="#FFFFFF" stroke-width="5"/>
</g>
</g>
</svg>

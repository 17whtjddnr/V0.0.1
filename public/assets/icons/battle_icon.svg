<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <title>전투 — 교차된 검</title>
  <defs>
    <filter id="shadow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <g id="sword" fill="#FFFFFF">
      <path d="M64 11 72 27v51H56V27l8-16Z"/>
      <rect x="44" y="78" width="40" height="8" rx="4"/>
      <rect x="59" y="86" width="10" height="19" rx="2"/>
      <rect x="55" y="105" width="18" height="8" rx="4"/>
    </g>
    <mask id="cross-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white"/>
      <path d="m78 50-28 28" stroke="black" stroke-width="24"/>
    </mask>
  </defs>
  <g filter="url(#shadow)">
    <g mask="url(#cross-gap)"><use href="#sword" transform="rotate(-45 64 64)"/></g>
    <use href="#sword" transform="rotate(45 64 64)"/>
  </g>
</svg>
